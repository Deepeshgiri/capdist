<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Deepesh - Profile</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
</head>
<body>

    <canvas id="cursorCanvas"></canvas>

    <div class="media-controls">
        <button class="control-btn" id="volumeBtn" title="Volume">
            <span class="icon">🔊</span>
        </button>
    </div>
    <div class="volume-slider" id="volumeSlider">
        <input type="range" id="volumeControl" min="0" max="100" value="50">
    </div>

    <!-- Per-slide background music -->
    <audio id="music1" loop src="media/music1.mp3"></audio>
    <audio id="music2" loop src="media/music2.mp3"></audio>
    <audio id="music3" loop src="media/music3.mp3"></audio>

    <div class="swiper-container">
        <div class="swiper-wrapper">

            <!-- ── Slide 1: Cyberpunk ── -->
            <div class="swiper-slide theme-1">
                <video class="slide-video" autoplay muted loop playsinline>
                    <source src="media/samurai.mp4" type="video/mp4">
                </video>
                <div class="slide-overlay"></div>
                <span class="theme-label">Cyberpunk</span>
                <div class="container">
                    <div class="avatar-section">
                        <div class="avatar-decoration">
                            <img src="https://cdn.discordapp.com/avatar-decoration-presets/a_ec5207e70ca2ef457c852d6135531d19.png" class="decoration-frame" alt="">
                            <img id="discordAvatar" class="avatar-img" src="" alt="Avatar">
                        </div>
                        <h1 class="profile-name" id="discordName">Deepesh</h1>
                        <div class="location" id="location">📍 Mars</div>
                    </div>
                    <div class="dogtag-card">
                        <div class="visitor-badge" id="visitorCount">0</div>
                        <div class="dogtag-content">
                            <div class="dogtag-avatar"><img id="dogtagAvatar" src="" alt=""></div>
                            <div class="dogtag-info">
                                <div class="dogtag-name" id="dogtagName">Deepesh<br><small>(CAP彡DIST)</small></div>
                                <div class="dogtag-username" id="dogtagUsername">@deepeshgiri</div>
                                <div class="dogtag-status">
                                    <span class="status-dot" id="statusDot">●</span>
                                    <span class="status-text" id="statusText">Online</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="social-links">
                        <a href="https://www.instagram.com/_deepesh_giri/" class="social-link" data-name="Instagram" target="_blank"><i class="fab fa-instagram"></i></a>
                        <a href="https://www.linkedin.com/in/deepesh-giri/" class="social-link" data-name="LinkedIn" target="_blank"><i class="fab fa-linkedin"></i></a>
                        <a href="https://www.facebook.com/pandit.deepesh.giri/" class="social-link" data-name="Facebook" target="_blank"><i class="fab fa-facebook"></i></a>
                        <a href="https://github.com/Deepeshgiri" class="social-link" data-name="GitHub" target="_blank"><i class="fab fa-github"></i></a>
                        <a href="https://www.youtube.com/@learnmore4318" class="social-link" data-name="YouTube" target="_blank"><i class="fab fa-youtube"></i></a>
                    </div>
                </div>
            </div>

            <!-- ── Slide 2: Synthwave ── -->
            <div class="swiper-slide theme-2">
                <video class="slide-video" autoplay muted loop playsinline>
                    <!-- Replace with your synthwave video -->
                    <source src="media/synthwave.mp4" type="video/mp4">
                </video>
                <div class="slide-overlay"></div>
                <span class="theme-label">Synthwave</span>
                <div class="container">
                    <div class="avatar-section">
                        <div class="avatar-decoration">
                            <img src="https://cdn.discordapp.com/avatar-decoration-presets/a_ec5207e70ca2ef457c852d6135531d19.png" class="decoration-frame" alt="">
                            <img id="discordAvatar2" class="avatar-img" src="" alt="Avatar">
                        </div>
                        <h1 class="profile-name" id="discordName2">Deepesh</h1>

                    </div>
                    <div class="dogtag-card">
                        <div class="visitor-badge" id="visitorCount2">0</div>
                        <div class="dogtag-content">
                            <div class="dogtag-avatar"><img id="dogtagAvatar2" src="" alt=""></div>
                            <div class="dogtag-info">
                                <div class="dogtag-name" id="dogtagName2">Deepesh<br><small>(CAP彡DIST)</small></div>
                                <div class="dogtag-username" id="dogtagUsername2">@deepeshgiri</div>
                                <div class="dogtag-status">
                                    <span class="status-dot" id="statusDot2">●</span>
                                    <span class="status-text" id="statusText2">Online</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="social-links">
                        <a href="https://www.instagram.com/_deepesh_giri/" class="social-link" data-name="Instagram" target="_blank"><i class="fab fa-instagram"></i></a>
                        <a href="https://www.linkedin.com/in/deepesh-giri/" class="social-link" data-name="LinkedIn" target="_blank"><i class="fab fa-linkedin"></i></a>
                        <a href="https://www.facebook.com/pandit.deepesh.giri/" class="social-link" data-name="Facebook" target="_blank"><i class="fab fa-facebook"></i></a>
                        <a href="https://github.com/Deepeshgiri" class="social-link" data-name="GitHub" target="_blank"><i class="fab fa-github"></i></a>
                        <a href="https://www.youtube.com/@learnmore4318" class="social-link" data-name="YouTube" target="_blank"><i class="fab fa-youtube"></i></a>
                    </div>
                </div>
            </div>

            <!-- ── Slide 3: Forest ── -->
            <div class="swiper-slide theme-3">
                <video class="slide-video" autoplay muted loop playsinline>
                    <!-- Replace with your forest video -->
                    <source src="media/forest.mp4" type="video/mp4">
                </video>
                <div class="slide-overlay"></div>
                <span class="theme-label">Forest</span>
                <div class="container">
                    <div class="avatar-section">
                        <div class="avatar-decoration">
                            <img src="https://cdn.discordapp.com/avatar-decoration-presets/a_ec5207e70ca2ef457c852d6135531d19.png" class="decoration-frame" alt="">
                            <img id="discordAvatar3" class="avatar-img" src="" alt="Avatar">
                        </div>
                        <h1 class="profile-name" id="discordName3">Deepesh</h1>
                        <div class="location" id="location3">📍 Mars</div>
                    </div>
                    <div class="dogtag-card">
                        <div class="visitor-badge" id="visitorCount3">0</div>
                        <div class="dogtag-content">
                            <div class="dogtag-avatar"><img id="dogtagAvatar3" src="" alt=""></div>
                            <div class="dogtag-info">
                                <div class="dogtag-name" id="dogtagName3">Deepesh<br><small>(CAP彡DIST)</small></div>
                                <div class="dogtag-username" id="dogtagUsername3">@deepeshgiri</div>
                                <div class="dogtag-status">
                                    <span class="status-dot" id="statusDot3">●</span>
                                    <span class="status-text" id="statusText3">Online</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="social-links">
                        <a href="https://www.instagram.com/_deepesh_giri/" class="social-link" data-name="Instagram" target="_blank"><i class="fab fa-instagram"></i></a>
                        <a href="https://www.linkedin.com/in/deepesh-giri/" class="social-link" data-name="LinkedIn" target="_blank"><i class="fab fa-linkedin"></i></a>
                        <a href="https://www.facebook.com/pandit.deepesh.giri/" class="social-link" data-name="Facebook" target="_blank"><i class="fab fa-facebook"></i></a>
                        <a href="https://github.com/Deepeshgiri" class="social-link" data-name="GitHub" target="_blank"><i class="fab fa-github"></i></a>
                        <a href="https://www.youtube.com/@learnmore4318" class="social-link" data-name="YouTube" target="_blank"><i class="fab fa-youtube"></i></a>
                    </div>

            </div>

        <div class="swiper-button-next"></div>
