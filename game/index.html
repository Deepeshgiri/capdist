<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAP彡DIST — Snake</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      padding: 16px;
      gap: 12px;
      user-select: none;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 380px;
    }
    .title {
      font-size: 1.1rem;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }
    #back {
      color: #a78bfa;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 1px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    #back:hover { opacity: 1; }

    /* ── Score bar ── */
    .scorebar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 380px;
      font-size: 0.8rem;
      letter-spacing: 2px;
    }
    .scorebar span { color: #a78bfa; }
    .scorebar .best { color: #60a5fa; }

    /* ── Canvas wrapper ── */
    .canvas-wrap {
      position: relative;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1;
    }
    canvas {
      width: 100%;
      height: 100%;
      border: 2px solid rgba(167,139,250,0.35);
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(167,139,250,0.15);
      background: #0d0d1a;
      display: block;
    }

    /* ── Overlay ── */
    .overlay {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: rgba(10,10,20,0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      backdrop-filter: blur(4px);
      transition: opacity 0.2s;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .overlay-sub {
      font-size: 0.8rem;
      color: #94a3b8;
      letter-spacing: 1px;
      text-align: center;
      line-height: 1.6;
    }
    .overlay-score {
      font-size: 1rem;
      color: #f472b6;
      letter-spacing: 2px;
    }
    .btn {
      padding: 10px 28px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 0 20px rgba(167,139,250,0.4);
    }
    .btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(167,139,250,0.6); }
    .btn:active { transform: scale(0.97); }

    /* ── Pause button ── */
    #pauseBtn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(167,139,250,0.15);
      border: 1px solid rgba(167,139,250,0.3);
      color: #a78bfa;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    #pauseBtn:hover { background: rgba(167,139,250,0.3); }

    /* ── D-pad ── */
    .dpad {
      display: grid;
      grid-template-areas: ". up ." "left . right" ". down .";
      gap: 6px;
      width: 100%;
      max-width: 180px;
    }
    .dpad-btn {
      width: 52px;
      height: 52px;
      border: 1px solid rgba(167,139,250,0.35);
      border-radius: 10px;
      background: rgba(167,139,250,0.1);
      color: #a78bfa;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .dpad-btn:active { background: rgba(167,139,250,0.35); transform: scale(0.92); }
    .dpad-btn.up    { grid-area: up; }
    .dpad-btn.left  { grid-area: left; }
    .dpad-btn.right { grid-area: right; }
    .dpad-btn.down  { grid-area: down; }

    .hint {
      font-size: 0.7rem;
      color: #475569;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="header">
    <span class="title">CAP彡DIST SNAKE</span>
    <a href="../profile.html" id="back">← Profile</a>
  </div>

  <div class="scorebar">
    <span>SCORE: <b id="scoreVal">0</b></span>
    <span class="best">BEST: <b id="bestVal">0</b></span>
  </div>

  <div class="canvas-wrap">
    <canvas id="c" width="400" height="400"></canvas>

    <button id="pauseBtn" style="display:none">⏸ PAUSE</button>

    <!-- Start overlay -->
    <div class="overlay" id="startOverlay">
      <div class="overlay-title">🐍 SNAKE</div>
      <div class="overlay-sub">Eat the pink dots.<br>Don't hit the walls or yourself.</div>
      <button class="btn" id="startBtn">▶ PLAY</button>
      <div class="overlay-sub hint">Arrow keys / WASD · P to pause</div>
    </div>

    <!-- Pause overlay -->
    <div class="overlay hidden" id="pauseOverlay">
      <div class="overlay-title">⏸ PAUSED</div>
      <button class="btn" id="resumeBtn">▶ RESUME</button>
    </div>

    <!-- Game over overlay -->
    <div class="overlay hidden" id="gameoverOverlay">
      <div class="overlay-title">GAME OVER</div>
      <div class="overlay-score" id="finalScore"></div>
      <button class="btn" id="retryBtn">↺ RETRY</button>
    </div>
  </div>

  <!-- D-pad for mobile -->
  <div class="dpad">
    <button class="dpad-btn up"    data-dir="up">▲</button>
    <button class="dpad-btn left"  data-dir="left">◀</button>
    <button class="dpad-btn right" data-dir="right">▶</button>
    <button class="dpad-btn down"  data-dir="down">▼</button>
  </div>

  <div class="hint">Arrow keys / WASD · P = pause</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const bestVal  = document.getElementById('bestVal');
    const finalScore = document.getElementById('finalScore');
    const pauseBtn = document.getElementById('pauseBtn');

    const startOverlay   = document.getElementById('startOverlay');
    const pauseOverlay   = document.getElementById('pauseOverlay');
    const gameoverOverlay = document.getElementById('gameoverOverlay');

    const COLS = 20, ROWS = 20;
    const S = canvas.width / COLS;

    let snake, dir, next, food, score, loop, running = false, paused = false;
    let best = parseInt(localStorage.getItem('snakeBest') || '0');
    bestVal.textContent = best;

    function init() {
      snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
      dir = {x:1,y:0}; next = {x:1,y:0};
      score = 0; scoreVal.textContent = 0;
      placeFood();
    }

    function placeFood() {
      do { food = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)}; }
      while (snake.some(s => s.x===food.x && s.y===food.y));
    }

    function speed() { return Math.max(65, 130 - score * 4); }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // grid dots
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      for (let x = 0; x < COLS; x++)
        for (let y = 0; y < ROWS; y++)
          ctx.fillRect(x*S + S/2 - 1, y*S + S/2 - 1, 2, 2);

      // food pulse
      const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 200);
      ctx.fillStyle = '#f472b6';
      ctx.shadowColor = '#f472b6';
      ctx.shadowBlur = 8 + pulse * 10;
      ctx.beginPath();
      ctx.arc(food.x*S + S/2, food.y*S + S/2, S/2 - 3 + pulse, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // snake
      snake.forEach((seg, i) => {
        const t = i / snake.length;
        ctx.fillStyle = i === 0 ? '#a78bfa' : `hsl(${220 + t*60}, 75%, ${62 - t*18}%)`;
        ctx.shadowColor = i === 0 ? '#a78bfa' : 'transparent';
        ctx.shadowBlur  = i === 0 ? 12 : 0;
        ctx.beginPath();
        ctx.roundRect(seg.x*S + 1.5, seg.y*S + 1.5, S - 3, S - 3, 5);
        ctx.fill();
      });
      ctx.shadowBlur = 0;

      // eyes on head
      const h = snake[0];
      ctx.fillStyle = '#0a0a0f';
      const ex = dir.x, ey = dir.y;
      const cx = h.x*S + S/2, cy = h.y*S + S/2;
      const perp = {x: -ey, y: ex};
      [[1,-1],[1,1]].forEach(([f,p]) => {
        ctx.beginPath();
        ctx.arc(cx + ex*S*0.22 + perp.x*S*0.18*p, cy + ey*S*0.22 + perp.y*S*0.18*p, 2.2, 0, Math.PI*2);
        ctx.fill();
      });
    }

    function tick() {
      dir = next;
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
          snake.some(s => s.x === head.x && s.y === head.y)) {
        endGame(); return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreVal.textContent = score;
        if (score > best) { best = score; bestVal.textContent = best; localStorage.setItem('snakeBest', best); }
        placeFood();
        clearInterval(loop);
        loop = setInterval(tick, speed());
      } else snake.pop();
      draw();
    }

    function startGame() {
      init(); draw();
      startOverlay.classList.add('hidden');
      gameoverOverlay.classList.add('hidden');
      pauseBtn.style.display = 'block';
      running = true; paused = false;
      loop = setInterval(tick, speed());
    }

    function endGame() {
      clearInterval(loop); running = false;
      pauseBtn.style.display = 'none';
      finalScore.textContent = `SCORE: ${score}${score >= best && score > 0 ? '  🏆 NEW BEST!' : ''}`;
      gameoverOverlay.classList.remove('hidden');
    }

    function togglePause() {
      if (!running) return;
      if (!paused) {
        clearInterval(loop); paused = true;
        pauseOverlay.classList.remove('hidden');
        pauseBtn.textContent = '▶ RESUME';
      } else {
        paused = false;
        pauseOverlay.classList.add('hidden');
        pauseBtn.textContent = '⏸ PAUSE';
        loop = setInterval(tick, speed());
      }
    }

    // Buttons
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('retryBtn').addEventListener('click', startGame);
    document.getElementById('resumeBtn').addEventListener('click', togglePause);
    pauseBtn.addEventListener('click', togglePause);

    // Keyboard
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'Enter') {
        if (!running) startGame();
        return;
      }
      if (e.code === 'KeyP') { togglePause(); return; }
      if (e.code === 'Escape') { if (running && !paused) togglePause(); return; }
      const map = {
        ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
        KeyW:{x:0,y:-1}, KeyS:{x:0,y:1}, KeyA:{x:-1,y:0}, KeyD:{x:1,y:0}
      };
      const d = map[e.code];
      if (d && !(d.x === -dir.x && d.y === -dir.y)) {
        next = d;
        if (paused) togglePause(); // resume on direction key
      }
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
    });

    // D-pad
    document.querySelectorAll('.dpad-btn').forEach(btn => {
      const press = () => {
        const map = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
        const d = map[btn.dataset.dir];
        if (!running) { startGame(); return; }
        if (d && !(d.x === -dir.x && d.y === -dir.y)) next = d;
        if (paused) togglePause();
      };
      btn.addEventListener('click', press);
      btn.addEventListener('touchstart', e => { e.preventDefault(); press(); }, {passive:false});
    });

    // Animate food pulse even when idle
    function animLoop() { if (running && !paused) draw(); requestAnimationFrame(animLoop); }
    animLoop();

    init(); draw();
  </script>
</body>
</html>
