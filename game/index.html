<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAP彡DIST — P2P Multiplayer Snake</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      padding: 12px;
      gap: 10px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 420px;
    }
    .title {
      font-size: 1rem;
      letter-spacing: 3px;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #back {
      color: #a78bfa;
      text-decoration: none;
      font-size: 0.72rem;
      letter-spacing: 1px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    #back:hover { opacity: 1; }

    #scoreboard {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
      max-width: 420px;
      min-height: 28px;
    }
    .sb-entry {
      font-size: 0.72rem;
      letter-spacing: 1px;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .sb-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .sb-dead { opacity: 0.35; text-decoration: line-through; }

    .canvas-wrap {
      position: relative;
      width: 100%;
      max-width: var(--canvas-max, 420px);
      aspect-ratio: 1;
      transition: max-width 0.4s ease;
    }
    canvas {
      width: 100%; height: 100%;
      border: 2px solid rgba(167,139,250,0.3);
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(167,139,250,0.12);
      background: #0d0d1a;
      display: block;
    }

    /* overlays */
    .overlay {
      position: absolute; inset: 0;
      border-radius: 12px;
      background: rgba(10,10,20,0.92);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px;
      backdrop-filter: blur(6px);
      transition: opacity 0.2s;
      z-index: 10;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .ov-title {
      font-size: 1.5rem; font-weight: 700; letter-spacing: 3px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-align: center;
    }
    .ov-sub {
      font-size: 0.78rem; color: #94a3b8;
      letter-spacing: 1px; text-align: center; line-height: 1.8;
    }
    .btn {
      padding: 10px 28px; border: none; border-radius: 8px;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      color: #fff; font-size: 0.88rem; font-weight: 600;
      letter-spacing: 2px; cursor: pointer;
      box-shadow: 0 0 20px rgba(167,139,250,0.4);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .btn:hover { transform: scale(1.05); }
    .btn:active { transform: scale(0.97); }
    .btn.secondary {
      background: linear-gradient(135deg, #475569, #334155);
      box-shadow: 0 0 20px rgba(71,85,105,0.4);
    }

    /* status pill */
    #statusPill {
      position: absolute; top: 10px; left: 10px;
      font-size: 0.65rem; letter-spacing: 1px;
      padding: 3px 9px; border-radius: 20px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      color: #64748b; z-index: 5;
      transition: color 0.3s, border-color 0.3s;
    }
    #statusPill.online { color: #34d399; border-color: rgba(52,211,153,0.4); }
    #statusPill.waiting { color: #fbbf24; border-color: rgba(251,191,36,0.4); }

    /* respawn */
    #respawnBar {
      position: absolute; bottom: 12px; left: 50%;
      transform: translateX(-50%);
      display: none; flex-direction: column;
      align-items: center; gap: 4px; z-index: 5;
    }
    #respawnBar.show { display: flex; }
    #respawnLabel { font-size: 0.7rem; color: #94a3b8; letter-spacing: 1px; }
    #respawnTrack {
      width: 120px; height: 4px;
      background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden;
    }
    #respawnFill {
      height: 100%;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      transition: width 0.1s linear;
    }

    /* dpad */
    .dpad {
      display: grid;
      grid-template-areas: ". up ." "left . right" ". down .";
      gap: 6px; max-width: 170px; width: 100%;
    }
    .dpad-btn {
      width: 50px; height: 50px;
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 10px;
      background: rgba(167,139,250,0.08);
      color: #a78bfa; font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .dpad-btn:active { background: rgba(167,139,250,0.3); transform: scale(0.92); }
    .dpad-btn.up    { grid-area: up; }
    .dpad-btn.left  { grid-area: left; }
    .dpad-btn.right { grid-area: right; }
    .dpad-btn.down  { grid-area: down; }

    .hint { font-size: 0.68rem; color: #334155; letter-spacing: 1px; }

    input {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(167,139,250,0.4);
      border-radius: 8px; color: #fff;
      font-size: 0.9rem; padding: 8px 14px;
      text-align: center; letter-spacing: 2px;
      outline: none; width: 220px;
    }
    input:focus { border-color: #a78bfa; }

    .color-swatches {
      display: flex; gap: 7px; flex-wrap: wrap; justify-content: center;
      width: 220px;
    }
    .swatch {
      width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
    }
    .swatch:hover { transform: scale(1.2); }
    .swatch.selected { border-color: #fff; transform: scale(1.2); }

    #chatBubble {
      position: fixed; bottom: 20px; right: 20px;
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      box-shadow: 0 0 20px rgba(167,139,250,0.5);
      border: none; cursor: pointer; font-size: 1.3rem;
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      transition: transform 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    #chatBubble:hover { transform: scale(1.1); }
    #chatBubble .unread {
      position: absolute; top: -3px; right: -3px;
      background: #ff4d6d; color: #fff;
      font-size: 0.6rem; font-weight: 700;
      width: 16px; height: 16px; border-radius: 50%;
      display: none; align-items: center; justify-content: center;
    }
    #chatBubble .unread.show { display: flex; }
    #chatDrawer {
      position: fixed; bottom: 78px; right: 20px;
      width: min(340px, calc(100vw - 40px));
      background: #0f0f1a;
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      z-index: 99;
      display: flex; flex-direction: column;
      overflow: hidden;
      transform: scale(0.85) translateY(20px);
      transform-origin: bottom right;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    #chatDrawer.open {
      transform: scale(1) translateY(0);
      opacity: 1;
      pointer-events: all;
    }
    #chatDrawerHeader {
      padding: 10px 14px;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 2px;
      color: #a78bfa;
      border-bottom: 1px solid rgba(167,139,250,0.15);
      display: flex; align-items: center; justify-content: space-between;
    }
    #chatLog {
      height: 160px; overflow-y: auto;
      padding: 10px 12px;
      display: flex; flex-direction: column; gap: 5px;
      scrollbar-width: thin;
      scrollbar-color: rgba(167,139,250,0.3) transparent;
    }
    .chat-msg { font-size: 0.75rem; line-height: 1.45; word-break: break-word; }
    .chat-name { font-weight: 700; margin-right: 4px; }
    #emojiPicker {
      display: none; flex-wrap: wrap; gap: 3px;
      padding: 8px 10px;
      border-top: 1px solid rgba(167,139,250,0.15);
      background: rgba(0,0,0,0.3);
    }
    #emojiPicker.open { display: flex; }
    .ep-emoji {
      font-size: 1.15rem; cursor: pointer; padding: 3px;
      border-radius: 4px; transition: background 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .ep-emoji:hover { background: rgba(167,139,250,0.2); }
    #chatInputRow {
      display: flex;
      border-top: 1px solid rgba(167,139,250,0.15);
    }
    #chatInput {
      flex: 1; width: auto; background: transparent; border: none;
      border-radius: 0; font-size: 0.82rem; padding: 9px 12px;
      letter-spacing: 0; text-align: left; color: #fff; outline: none;
    }
    #emojiBtn, #chatSendBtn {
      background: none; border: none; cursor: pointer; color: #a78bfa;
      border-left: 1px solid rgba(167,139,250,0.15);
      -webkit-tap-highlight-color: transparent;
    }
    #emojiBtn { font-size: 1.1rem; padding: 0 10px; }
    #chatSendBtn { font-size: 0.72rem; font-weight: 700; padding: 0 12px; letter-spacing: 1px; }
  </style>
</head>
<body>

<div class="header">
  <span class="title">CAP彡DIST SNAKE</span>
  <a href="../profile.html" id="back">← Profile</a>
</div>

<div id="scoreboard"></div>

<div class="canvas-wrap">
  <canvas id="c" width="400" height="400"></canvas>
  <div id="statusPill">offline</div>

  <div id="respawnBar">
    <div id="respawnLabel">respawning…</div>
    <div id="respawnTrack"><div id="respawnFill" style="width:100%"></div></div>
  </div>

  <!-- main menu overlay -->
  <div class="overlay" id="joinOverlay">
    <div class="ov-title">🐍 SNAKE</div>
    <div class="ov-sub" style="margin-bottom: 8px;">P2P Multiplayer · No Server</div>
    <input id="nameInput" maxlength="12" placeholder="Your name…" spellcheck="false">
    <div class="color-swatches" id="colorSwatches"></div>

    <div style="display:flex; flex-direction:column; gap:10px; width:220px; margin-top: 6px;">
      <button class="btn" id="quickPlayBtn" style="padding:10px; background: linear-gradient(135deg, #34d399, #10b981);">QUICK PLAY (PUBLIC)</button>
      <div style="display:flex; gap:10px;">
        <button class="btn secondary" id="hostBtn" style="flex:1; padding:10px; font-size:0.8rem;">HOST PRV</button>
        <button class="btn secondary" id="joinMenuBtn" style="flex:1; padding:10px; font-size:0.8rem;">JOIN PRV</button>
      </div>
    </div>
    <div class="ov-sub" style="font-size:0.68rem;color:#475569;margin-top:8px;">Arrow keys / WASD to move</div>
  </div>

  <!-- join room overlay -->
  <div class="overlay hidden" id="connectOverlay">
    <div class="ov-title">JOIN GAME</div>
    <div class="ov-sub" style="margin-bottom: 8px;">Enter the Host's Room Code</div>
    <input id="roomInput" maxlength="10" placeholder="CODE" spellcheck="false" style="text-transform:uppercase;">
    <div style="display:flex; gap:10px; width:220px; margin-top:10px;">
      <button class="btn secondary" id="backToMenuBtn" style="flex:1; padding:10px;">BACK</button>
      <button class="btn" id="joinRoomBtn" style="flex:1; padding:10px;">CONNECT</button>
    </div>
  </div>

  <!-- waiting overlay -->
  <div class="overlay hidden" id="waitOverlay">
    <div class="ov-title" id="waitTitle">WAITING…</div>
    <div class="ov-sub" id="waitSub" style="user-select:text;">
      Room Code:<br>
      <strong id="roomCodeDisp" style="color:#fff; letter-spacing:2px; font-size:1.4rem; display:block; margin-top:6px;">...</strong>
    </div>
    <button class="btn hidden" id="startBtn">▶ START GAME</button>
    <div class="ov-sub" id="waitPlayers">1 player in room</div>
  </div>

  <!-- dead overlay -->
  <div class="overlay hidden" id="deadOverlay">
    <div class="ov-title" id="deadTitle">💀 YOU DIED</div>
    <div class="ov-sub" id="deadMsg"></div>
  </div>
</div>

<div class="dpad">
  <button class="dpad-btn up"    data-dir="up">▲</button>
  <button class="dpad-btn left"  data-dir="left">◀</button>
  <button class="dpad-btn right" data-dir="right">▶</button>
  <button class="dpad-btn down"  data-dir="down">▼</button>
</div>
<div class="hint">Arrow keys / WASD</div>

<!-- floating chat bubble -->
<button id="chatBubble">
  💬
  <span class="unread" id="unreadBadge"></span>
</button>

<!-- chat drawer -->
<div id="chatDrawer">
  <div id="chatDrawerHeader">
    <span>💬 CHAT</span>
    <span id="chatCloseBtn" style="cursor:pointer;opacity:0.5;font-size:1rem;">✕</span>
  </div>
  <div id="chatLog"></div>
  <div id="emojiPicker"></div>
  <div id="chatInputRow">
    <input id="chatInput" maxlength="80" placeholder="Say something…" spellcheck="false" autocomplete="off">
    <button id="emojiBtn">😊</button>
    <button id="chatSendBtn">SEND</button>
  </div>
</div>

<script>
// ── Config ─────────────────────────────────────────────────
const CS = 400;
const BASE_GRID = 20;   // grid at 1 player
const GRID_STEP = 2;    // extra cells per additional player
const MAX_GRID = 34;    // cap
let COLS = BASE_GRID, ROWS = BASE_GRID;
let S = CS / COLS;
const TICK = 320;
const RESPAWN_MS = 3000;
const COLORS = ['#ff4d6d','#06d6a0','#ffd166','#118ab2','#ff9f1c','#8338ec','#3a86ff','#ff006e','#43aa8b','#f4d35e','#ee4266','#0ead69'];

// ── Local state ────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

let peer = null;
let isHost = false;
let connections = []; // For Host: array of DataConnections. For Client: array of one DataConnection (to host)

let myId    = '';
let myName  = '';
let myColor = '';
let myDir   = { x: 1, y: 0 };
let myNext  = { x: 1, y: 0 };
let mySnake = [];
let myScore = 0;
let myAlive = false;
let gameRunning = false;

let isQuickPlaySearch = false;
let quickPlayTarget = 1;
const MAX_QUICK_PLAY_ROOMS = 5;

let players = {};   // id → { name, color, snake, dir, score, alive }
let food    = { x: 5, y: 5 };
let tickTimer   = null;
let respawnTimer = null;
let animId      = null;

// ── UI refs ────────────────────────────────────────────────
const joinOverlay    = document.getElementById('joinOverlay');
const connectOverlay = document.getElementById('connectOverlay');
const waitOverlay    = document.getElementById('waitOverlay');
const deadOverlay    = document.getElementById('deadOverlay');
const statusPill     = document.getElementById('statusPill');
const waitPlayers    = document.getElementById('waitPlayers');
const nameInput      = document.getElementById('nameInput');
const roomInput      = document.getElementById('roomInput');
const roomCodeDisp   = document.getElementById('roomCodeDisp');
const startBtn       = document.getElementById('startBtn');
const waitTitle      = document.getElementById('waitTitle');
const respawnBar     = document.getElementById('respawnBar');
const respawnFill    = document.getElementById('respawnFill');
const deadMsg        = document.getElementById('deadMsg');

// ── Helpers ────────────────────────────────────────────────
function randomName() {
  const a = ['Swift','Neon','Ghost','Cyber','Blaze','Storm','Pixel','Void'];
  const b = ['Viper','Cobra','Mamba','Asp','Boa','Python','Adder','Krait'];
  return a[Math.random()*a.length|0] + b[Math.random()*b.length|0];
}

function pickColor() {
  const used = Object.values(players).map(p => p.color);
  return COLORS.find(c => !used.includes(c)) || COLORS[Math.random()*COLORS.length|0];
}

function generateRoomCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let result = '';
  for (let i = 0; i < 5; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
  return result;
}

function resizeGrid(playerCount) {
  const extra = Math.min(playerCount - 1, (MAX_GRID - BASE_GRID) / GRID_STEP) * GRID_STEP;
  COLS = BASE_GRID + extra;
  ROWS = BASE_GRID + extra;
  S = CS / COLS;
  // grow canvas-wrap max-width proportionally so cells don't get too tiny
  const maxW = 420 + extra * 8;
  document.querySelector('.canvas-wrap').style.setProperty('--canvas-max', maxW + 'px');
  document.querySelector('.header').style.maxWidth = maxW + 'px';
  document.getElementById('scoreboard').style.maxWidth = maxW + 'px';
}

function getPlayerCount() {
  return 1 + (isHost ? connections.length : Object.keys(players).length);
}

function spawnSnake() {
  const x = 3 + Math.floor(Math.random() * (COLS - 6));
  const y = 3 + Math.floor(Math.random() * (ROWS - 6));
  return [{ x, y }, { x: x-1, y }, { x: x-2, y }];
}

function newFood(snakes) {
  const occ = snakes.flat();
  let f;
  do { f = { x: Math.random()*COLS|0, y: Math.random()*ROWS|0 }; }
  while (occ.some(s => s.x===f.x && s.y===f.y));
  return f;
}

// ── Network Logic (PeerJS) ─────────────────────────────────

function initPeer(id) {
  peer = new Peer(id, {
    debug: 0,
    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
  });

  peer.on('open', (id) => {
    myId = id;
    if (isHost) {
      roomCodeDisp.textContent = isQuickPlaySearch ? 'PUBLIC' : id;
      statusPill.textContent = '● HOSTING';
      statusPill.className = 'waiting';
      startBtn.classList.remove('hidden');
      waitTitle.textContent = isQuickPlaySearch ? 'HOSTING PUBLIC ROOM' : 'HOSTING ROOM';
      updateWaitUI();
    } else {
      if (isQuickPlaySearch) {
        statusPill.textContent = '● SEARCHING';
      } else {
        statusPill.textContent = '● CONNECTED';
        statusPill.className = 'waiting';
        waitTitle.textContent = 'WAITING FOR HOST…';
        roomCodeDisp.textContent = roomInput.value.toUpperCase();
      }
    }
  });

  peer.on('connection', (conn) => {
    if (!isHost) return;
    if (connections.length >= 8) {
      conn.on('open', () => { conn.send({ type: 'full' }); setTimeout(() => conn.close(), 500); });
      return;
    }
    connections.push(conn);
    setupConnection(conn);
    conn.on('open', () => {
      resizeGrid(1 + connections.length);
      conn.send({ type: 'sync', players: getCombinedPlayers(), food, running: gameRunning, cols: COLS });
      if (!gameRunning) {
        updateWaitUI();
        if (isQuickPlaySearch) {
          food = newFood([spawnSnake()]);
          broadcastStart();
          startGameLocally();
          broadcastSync();
        }
      }
    });
    conn.on('close', () => {
      connections = connections.filter(c => c !== conn);
      delete players[conn.peer];
      resizeGrid(1 + connections.length);
      if (gameRunning) broadcastSync();
      else updateWaitUI();
    });
  });

  peer.on('error', (err) => {
    if (!isQuickPlaySearch) {
      console.error(err);
      alert('Connection error: ' + err.type);
      resetToMenu();
    }
  });
}

function handleQuickPlayError(err) {
  if (err.type === 'peer-unavailable') {
    // No host found on this slot — become the host
    isHost = true;
    peer.off('error', handleQuickPlayError);
    peer.on('error', (e) => { console.error(e); });
    const hostId = `CAP-PUB-${quickPlayTarget}`;
    // Re-register with the public room ID
    peer.destroy();
    peer = new Peer(hostId, {
      debug: 0,
      config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
    });
    peer.on('open', (id) => {
      myId = id;
      roomCodeDisp.textContent = 'PUBLIC';
      statusPill.textContent = '● HOSTING';
      statusPill.className = 'waiting';
      waitTitle.textContent = 'HOSTING PUBLIC ROOM';
      startBtn.classList.remove('hidden');
      updateWaitUI();
    });
    peer.on('connection', (conn) => {
      if (connections.length >= 8) {
        conn.on('open', () => { conn.send({ type: 'full' }); setTimeout(() => conn.close(), 500); });
        return;
      }
      connections.push(conn);
      setupConnection(conn);
      conn.on('open', () => {
        resizeGrid(1 + connections.length);
        conn.send({ type: 'sync', players: getCombinedPlayers(), food, running: gameRunning, cols: COLS });
        if (!gameRunning) {
          updateWaitUI();
          food = newFood([spawnSnake()]);
          broadcastStart();
          startGameLocally();
          broadcastSync();
        }
      });
      conn.on('close', () => {
        connections = connections.filter(c => c !== conn);
        delete players[conn.peer];
        resizeGrid(1 + connections.length);
        if (gameRunning) broadcastSync();
        else updateWaitUI();
      });
    });
    peer.on('error', (e) => {
      if (e.type === 'unavailable-id') {
        // Slot taken, try next
        quickPlayTarget = (quickPlayTarget % MAX_QUICK_PLAY_ROOMS) + 1;
        isHost = false;
        peer.destroy();
        peer = new Peer({
          debug: 0,
          config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
        });
        peer.on('open', (id) => { myId = id; connectToHost(`CAP-PUB-${quickPlayTarget}`); });
        peer.on('error', handleQuickPlayError);
      }
    });
    return;
  }
  console.error(err);
  alert('Connection error: ' + err.type);
  resetToMenu();
}

function setupConnection(conn) {
  conn.on('data', (data) => {
    if (isHost) {
      if (data.type === 'chat') {
        addChatMsg(data.name, data.color, data.text);
        connections.forEach(c => { if (c.open && c !== conn) c.send(data); });
        return;
      }
      if (data.type === 'state') {
        // record last known head before updating
        if (players[data.id] && players[data.id].snake && players[data.id].snake.length > 0)
          lastHead[data.id] = players[data.id].snake[0];
        players[data.id] = data.data;
        checkKillsOnTick();
        broadcastSync();
      } else if (data.type === 'ate') {
        const allSnakes = Object.values(getCombinedPlayers()).filter(p => p.alive).map(p => p.snake).filter(Boolean);
        food = newFood(allSnakes);
        broadcastFood();
      }
    } else {
      if (data.type === 'full') { alert('This room is full.'); resetToMenu(); return; }
      if (data.type === 'chat') { addChatMsg(data.name, data.color, data.text); return; }
      if (data.type === 'sync') {
        players = data.players;
        delete players[myId];
        food = data.food;
        if (data.cols && data.cols !== COLS) {
          COLS = data.cols; ROWS = data.cols; S = CS / COLS;
          const extra = COLS - BASE_GRID;
          const maxW = 420 + extra * 8;
          document.querySelector('.canvas-wrap').style.setProperty('--canvas-max', maxW + 'px');
          document.querySelector('.header').style.maxWidth = maxW + 'px';
          document.getElementById('scoreboard').style.maxWidth = maxW + 'px';
        }
        if (data.running && !gameRunning) startGameLocally();
        else if (!gameRunning) updateWaitUI();
      } else if (data.type === 'start') {
        if (!gameRunning) startGameLocally();
      } else if (data.type === 'food') {
        food = data.food;
      }
    }
  });
}

function connectToHost(hostId) {
  const conn = peer.connect(hostId, { reliable: true });
  connections.push(conn);
  setupConnection(conn);

  conn.on('open', () => {
    statusPill.textContent = '● CONNECTED';
    statusPill.className = 'waiting';
    waitTitle.textContent = 'WAITING FOR HOST…';
    broadcastMyState();
  });

  conn.on('close', () => {
    if (!gameRunning) { alert('Disconnected from host.'); resetToMenu(); }
  });
}

function getCombinedPlayers() {
  const all = { ...players };
  all[myId] = { name: myName, color: myColor, snake: mySnake, dir: myDir, score: myScore, alive: myAlive };
  return all;
}

function broadcastSync() {
  if (!isHost) return;
  const syncData = {
    type: 'sync',
    players: getCombinedPlayers(),
    food: food,
    running: gameRunning,
    cols: COLS
  };
  connections.forEach(conn => {
    if (conn.open) conn.send(syncData);
  });
}

const lastHead = {};
const prevAlive = {};

function checkKillsOnTick() {
  const all = getCombinedPlayers();
  Object.entries(all).forEach(([vid, victim]) => {
    if (prevAlive[vid] && !victim.alive) {
      const lh = lastHead[vid];
      if (lh) {
        Object.entries(all).forEach(([kid, killer]) => {
          if (kid === vid || !killer.alive || !killer.snake) return;
          if (killer.snake.some(s => s.x === lh.x && s.y === lh.y)) {
            if (kid === myId) myScore += 5;
            else if (players[kid]) players[kid].score += 5;
          }
        });
      }
    }
    prevAlive[vid] = victim.alive;
  });
}

function broadcastMyState() {
  const myState = {
    type: 'state',
    id: myId,
    data: { name: myName, color: myColor, snake: mySnake, dir: myDir, score: myScore, alive: myAlive }
  };
  if (isHost) {
    broadcastSync();
  } else {
    connections.forEach(conn => { if (conn.open) conn.send(myState); });
  }
}

function broadcastFood() {
  connections.forEach(conn => {
    if (conn.open) conn.send({ type: 'food', food: food });
  });
}

function broadcastStart() {
  if (!isHost) return;
  connections.forEach(conn => {
    if (conn.open) conn.send({ type: 'start' });
  });
}

// ── Game tick (each player runs their own snake) ───────────

function startGameLocally() {
  if (gameRunning) return;
  gameRunning = true;
  clearInterval(tickTimer);
  waitOverlay.classList.add('hidden');
  deadOverlay.classList.add('hidden');
  statusPill.textContent = '● LIVE';
  statusPill.className = 'online';

  mySnake = spawnSnake();
  myDir   = { x: 1, y: 0 };
  myNext  = { x: 1, y: 0 };
  myAlive = true;
  myScore = 0;

  broadcastMyState();
  tickTimer = setInterval(tick, TICK);
}

function tick() {
  if (!myAlive) return;
  myDir = myNext;

  const head = { x: mySnake[0].x + myDir.x, y: mySnake[0].y + myDir.y };

  // wall — wrap to opposite side
  if (head.x < 0)      head.x = COLS - 1;
  if (head.x >= COLS)  head.x = 0;
  if (head.y < 0)      head.y = ROWS - 1;
  if (head.y >= ROWS)  head.y = 0;

  // track host's last head for kill detection
  if (isHost) lastHead[myId] = mySnake[0];

  // self
  if (mySnake.some(s => s.x === head.x && s.y === head.y)) { die(); return; }

  // other snakes
  const others = Object.entries(players).filter(([,p]) => p.alive);
  const killerEntry = others.find(([,p]) => p.snake && p.snake.some(s => s.x === head.x && s.y === head.y));
  if (killerEntry) { die(killerEntry[1].name); return; }

  mySnake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    myScore++;
    if (isHost) {
      const allSnakes = [mySnake, ...Object.values(players).filter(p => p.alive).map(p => p.snake).filter(Boolean)];
      food = newFood(allSnakes);
      broadcastFood();
    } else {
      connections.forEach(conn => { if (conn.open) conn.send({ type: 'ate' }); });
    }
  } else {
    mySnake.pop();
  }

  broadcastMyState();
}

const deadTitle = document.getElementById('deadTitle');

function die(killerName = null) {
  myAlive = false;
  mySnake = [];
  if (isHost) checkKillsOnTick();
  broadcastMyState();

  deadTitle.textContent = killerName ? `☠️ KILLED BY ${killerName.toUpperCase()}` : '💀 YOU DIED';
  deadMsg.textContent = `Score: ${myScore}`;
  deadOverlay.classList.remove('hidden');
  respawnBar.classList.add('show');

  let elapsed = 0;
  clearInterval(respawnTimer);
  respawnTimer = setInterval(() => {
    elapsed += 100;
    respawnFill.style.width = Math.max(0, 100 - (elapsed / RESPAWN_MS * 100)) + '%';
    if (elapsed >= RESPAWN_MS) {
      clearInterval(respawnTimer);
      respawnBar.classList.remove('show');
      deadOverlay.classList.add('hidden');
      respawn();
    }
  }, 100);
}

function respawn() {
  mySnake = spawnSnake();
  myDir   = { x: 1, y: 0 };
  myNext  = { x: 1, y: 0 };
  myAlive = true;
  broadcastMyState();
}

// ── Draw ───────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, CS, CS);

  // grid dots
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  for (let x = 0; x < COLS; x++)
    for (let y = 0; y < ROWS; y++)
      ctx.fillRect(x*S+S/2-1, y*S+S/2-1, 2, 2);

  // food
  const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 200);
  ctx.fillStyle = '#f472b6';
  ctx.shadowColor = '#f472b6';
  ctx.shadowBlur = 8 + pulse * 10;
  ctx.beginPath();
  ctx.arc(food.x*S+S/2, food.y*S+S/2, S/2-3+pulse, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // draw all snakes
  const allPlayers = [
    { snake: mySnake, color: myColor, name: myName, dir: myDir, alive: myAlive, score: myScore },
    ...Object.values(players)
  ];

  allPlayers.forEach(p => {
    if (!p.alive || !p.snake || p.snake.length === 0) return;
    p.snake.forEach((seg, i) => {
      const t = i / p.snake.length;
      ctx.globalAlpha = 1 - t * 0.45;
      ctx.fillStyle = p.color;
      ctx.shadowColor = i === 0 ? p.color : 'transparent';
      ctx.shadowBlur  = i === 0 ? 14 : 0;
      ctx.beginPath();
      ctx.roundRect(seg.x*S+1.5, seg.y*S+1.5, S-3, S-3, 5);
      ctx.fill();
    });
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;

    // name tag
    const head = p.snake[0];
    if (head) {
        ctx.fillStyle = p.color;
        ctx.font = `bold ${S*0.52}px Segoe UI`;
        ctx.textAlign = 'center';
        ctx.fillText((p.name || '?').slice(0, 10), head.x*S+S/2, head.y*S - 3);

        // eyes
        const d = p.dir || { x:1, y:0 };
        const perp = { x: -d.y, y: d.x };
        const cx = head.x*S+S/2, cy = head.y*S+S/2;
        ctx.fillStyle = '#0a0a0f';
        [1, -1].forEach(side => {
        ctx.beginPath();
        ctx.arc(cx+d.x*S*0.22+perp.x*S*0.18*side, cy+d.y*S*0.22+perp.y*S*0.18*side, 2, 0, Math.PI*2);
        ctx.fill();
        });
    }
  });

  ctx.textAlign = 'left';

  // scoreboard
  const sb = document.getElementById('scoreboard');
  sb.innerHTML = '';
  allPlayers
    .filter(p => p.name)
    .sort((a, b) => b.score - a.score)
    .forEach(p => {
      const el = document.createElement('div');
      el.className = 'sb-entry' + (p.alive ? '' : ' sb-dead');
      el.innerHTML = `<div class="sb-dot" style="background:${p.color}"></div>${p.name}: ${p.score}`;
      sb.appendChild(el);
    });

  animId = requestAnimationFrame(draw);
}

// ── Controls ───────────────────────────────────────────────
const DIRS = {
  ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
  KeyW:{x:0,y:-1}, KeyS:{x:0,y:1}, KeyA:{x:-1,y:0}, KeyD:{x:1,y:0}
};
document.addEventListener('keydown', e => {
  if (DIRS[e.code]) {
    const d = DIRS[e.code];
    if (!(d.x === -myDir.x && d.y === -myDir.y)) myNext = d;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  }
});

document.querySelectorAll('.dpad-btn').forEach(btn => {
  const map = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
  const press = () => {
    const d = map[btn.dataset.dir];
    if (d && !(d.x === -myDir.x && d.y === -myDir.y)) myNext = d;
  };
  btn.addEventListener('click', press);
  btn.addEventListener('touchstart', e => { e.preventDefault(); press(); }, { passive: false });
});

// ── UI Flow ────────────────────────────────────────────────
nameInput.value = randomName();

// colour swatches
let selectedColor = COLORS[0];
COLORS.forEach((c, i) => {
  const sw = document.createElement('div');
  sw.className = 'swatch' + (i === 0 ? ' selected' : '');
  sw.style.background = c;
  sw.addEventListener('click', () => {
    selectedColor = c;
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
    sw.classList.add('selected');
  });
  document.getElementById('colorSwatches').appendChild(sw);
});

function updateWaitUI() {
  if (gameRunning) return;
  const n = (isHost ? 1 : 1) + (isHost ? connections.length : Object.keys(players).length);
  waitPlayers.textContent = `${n} player${n !== 1 ? 's' : ''} in room`;
}

function resetToMenu() {
    if (peer) {
        peer.destroy();
        peer = null;
    }
    gameRunning = false;
    isQuickPlaySearch = false;
    clearInterval(tickTimer);
    connections = [];
    players = {};
    joinOverlay.classList.remove('hidden');
    waitOverlay.classList.add('hidden');
    connectOverlay.classList.add('hidden');
    deadOverlay.classList.add('hidden');
    statusPill.textContent = 'offline';
    statusPill.className = '';
}

document.getElementById('quickPlayBtn').addEventListener('click', () => {
  myName  = nameInput.value.trim() || randomName();
  myColor = selectedColor;
  isHost  = false;
  isQuickPlaySearch = true;
  quickPlayTarget = 1;

  joinOverlay.classList.add('hidden');
  waitOverlay.classList.remove('hidden');
  waitTitle.textContent = 'FINDING GAME…';
  roomCodeDisp.textContent = 'PUBLIC';

  peer = new Peer({
    debug: 0,
    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
  });
  peer.on('open', (id) => {
    myId = id;
    connectToHost(`CAP-PUB-${quickPlayTarget}`);
  });
  peer.on('error', handleQuickPlayError);
});

document.getElementById('hostBtn').addEventListener('click', () => {
  myName  = nameInput.value.trim() || randomName();
  myColor = selectedColor;
  isHost  = true;
  isQuickPlaySearch = false;

  joinOverlay.classList.add('hidden');
  waitOverlay.classList.remove('hidden');
  
  const hostId = 'CAP-' + generateRoomCode();
  initPeer(hostId);
});

document.getElementById('joinMenuBtn').addEventListener('click', () => {
  joinOverlay.classList.add('hidden');
  connectOverlay.classList.remove('hidden');
});

document.getElementById('backToMenuBtn').addEventListener('click', () => {
  connectOverlay.classList.add('hidden');
  joinOverlay.classList.remove('hidden');
});

document.getElementById('joinRoomBtn').addEventListener('click', () => {
  const code = roomInput.value.trim().toUpperCase();
  if (!code) return;

  myName  = nameInput.value.trim() || randomName();
  myColor = selectedColor;
  isHost  = false;
  isQuickPlaySearch = false;

  connectOverlay.classList.add('hidden');
  waitOverlay.classList.remove('hidden');

  const fullCode = code.startsWith('CAP-') ? code : 'CAP-' + code;
  peer = new Peer({ debug: 0, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } });
  peer.on('open', (id) => { myId = id; connectToHost(fullCode); });
  peer.on('error', (err) => { alert('Connection error: ' + err.type); resetToMenu(); });
});

startBtn.addEventListener('click', () => {
  if (isHost) {
    resizeGrid(1 + connections.length);
    const allSnakes = [spawnSnake()];
    food = newFood(allSnakes);
    gameRunning = true;
    broadcastStart();
    broadcastSync();
    startGameLocally();
  }
});

// ── Chat ─────────────────────────────────────────────────
const chatLog     = document.getElementById('chatLog');
const chatInput   = document.getElementById('chatInput');
const emojiPicker = document.getElementById('emojiPicker');
const chatDrawer  = document.getElementById('chatDrawer');
const unreadBadge = document.getElementById('unreadBadge');
let unreadCount = 0;
let drawerOpen  = false;

const EMOJIS = ['😂','😍','🔥','💀','👑','🐍','😎','🤣','😭','💪','🎉','👀','😡','🥶','🤯','💯','👏','🫡','🤝','⚡','❤️','💥','🏆','😈','🙏'];

EMOJIS.forEach(e => {
  const btn = document.createElement('span');
  btn.className = 'ep-emoji';
  btn.textContent = e;
  btn.addEventListener('click', () => { chatInput.value += e; chatInput.focus(); });
  emojiPicker.appendChild(btn);
});

function toggleDrawer(open) {
  drawerOpen = open;
  chatDrawer.classList.toggle('open', open);
  if (open) {
    unreadCount = 0;
    unreadBadge.textContent = '';
    unreadBadge.classList.remove('show');
    chatLog.scrollTop = chatLog.scrollHeight;
    setTimeout(() => chatInput.focus(), 200);
  }
}

document.getElementById('chatBubble').addEventListener('click', () => toggleDrawer(!drawerOpen));
document.getElementById('chatCloseBtn').addEventListener('click', () => toggleDrawer(false));
document.getElementById('emojiBtn').addEventListener('click', () => emojiPicker.classList.toggle('open'));

function addChatMsg(name, color, text) {
  const div = document.createElement('div');
  div.className = 'chat-msg';
  div.innerHTML = `<span class="chat-name" style="color:${color}">${name.slice(0,12)}</span><span>${text.slice(0,80)}</span>`;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  if (!drawerOpen) {
    unreadCount++;
    unreadBadge.textContent = unreadCount > 9 ? '9+' : unreadCount;
    unreadBadge.classList.add('show');
  }
}

function sendChat() {
  const text = chatInput.value.trim();
  if (!text || !myName) return;
  chatInput.value = '';
  emojiPicker.classList.remove('open');
  addChatMsg(myName, myColor, text);
  const msg = { type: 'chat', name: myName, color: myColor, text };
  connections.forEach(conn => { if (conn.open) conn.send(msg); });
}

document.getElementById('chatSendBtn').addEventListener('click', sendChat);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendChat(); } });

// ── Boot ───────────────────────────────────────────────────
draw();

window.addEventListener('beforeunload', () => {
  if (peer) peer.destroy();
});
</script>
