<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAP彡DIST — Multiplayer Snake</title>
  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      padding: 12px;
      gap: 10px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 420px;
    }
    .title {
      font-size: 1rem;
      letter-spacing: 3px;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #back {
      color: #a78bfa;
      text-decoration: none;
      font-size: 0.72rem;
      letter-spacing: 1px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    #back:hover { opacity: 1; }

    #scoreboard {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
      max-width: 420px;
      min-height: 28px;
    }
    .sb-entry {
      font-size: 0.72rem;
      letter-spacing: 1px;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .sb-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .sb-dead { opacity: 0.35; text-decoration: line-through; }

    .canvas-wrap {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1;
    }
    canvas {
      width: 100%; height: 100%;
      border: 2px solid rgba(167,139,250,0.3);
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(167,139,250,0.12);
      background: #0d0d1a;
      display: block;
    }

    /* overlays */
    .overlay {
      position: absolute; inset: 0;
      border-radius: 12px;
      background: rgba(10,10,20,0.92);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px;
      backdrop-filter: blur(6px);
      transition: opacity 0.2s;
      z-index: 10;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .ov-title {
      font-size: 1.5rem; font-weight: 700; letter-spacing: 3px;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .ov-sub {
      font-size: 0.78rem; color: #94a3b8;
      letter-spacing: 1px; text-align: center; line-height: 1.8;
    }
    .btn {
      padding: 10px 28px; border: none; border-radius: 8px;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      color: #fff; font-size: 0.88rem; font-weight: 600;
      letter-spacing: 2px; cursor: pointer;
      box-shadow: 0 0 20px rgba(167,139,250,0.4);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .btn:hover { transform: scale(1.05); }
    .btn:active { transform: scale(0.97); }

    /* status pill */
    #statusPill {
      position: absolute; top: 10px; left: 10px;
      font-size: 0.65rem; letter-spacing: 1px;
      padding: 3px 9px; border-radius: 20px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      color: #64748b; z-index: 5;
      transition: color 0.3s, border-color 0.3s;
    }
    #statusPill.online { color: #34d399; border-color: rgba(52,211,153,0.4); }
    #statusPill.waiting { color: #fbbf24; border-color: rgba(251,191,36,0.4); }

    /* respawn */
    #respawnBar {
      position: absolute; bottom: 12px; left: 50%;
      transform: translateX(-50%);
      display: none; flex-direction: column;
      align-items: center; gap: 4px; z-index: 5;
    }
    #respawnBar.show { display: flex; }
    #respawnLabel { font-size: 0.7rem; color: #94a3b8; letter-spacing: 1px; }
    #respawnTrack {
      width: 120px; height: 4px;
      background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden;
    }
    #respawnFill {
      height: 100%;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      transition: width 0.1s linear;
    }

    /* dpad */
    .dpad {
      display: grid;
      grid-template-areas: ". up ." "left . right" ". down .";
      gap: 6px; max-width: 170px; width: 100%;
    }
    .dpad-btn {
      width: 50px; height: 50px;
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 10px;
      background: rgba(167,139,250,0.08);
      color: #a78bfa; font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .dpad-btn:active { background: rgba(167,139,250,0.3); transform: scale(0.92); }
    .dpad-btn.up    { grid-area: up; }
    .dpad-btn.left  { grid-area: left; }
    .dpad-btn.right { grid-area: right; }
    .dpad-btn.down  { grid-area: down; }

    .hint { font-size: 0.68rem; color: #334155; letter-spacing: 1px; }

    /* name input */
    #nameInput {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(167,139,250,0.4);
      border-radius: 8px; color: #fff;
      font-size: 0.9rem; padding: 8px 14px;
      text-align: center; letter-spacing: 2px;
      outline: none; width: 200px;
    }
    #nameInput:focus { border-color: #a78bfa; }
  </style>
</head>
<body>

<div class="header">
  <span class="title">CAP彡DIST SNAKE</span>
  <a href="../profile.html" id="back">← Profile</a>
</div>

<div id="scoreboard"></div>

<div class="canvas-wrap">
  <canvas id="c" width="400" height="400"></canvas>
  <div id="statusPill">connecting…</div>

  <div id="respawnBar">
    <div id="respawnLabel">respawning…</div>
    <div id="respawnTrack"><div id="respawnFill" style="width:100%"></div></div>
  </div>

  <!-- join overlay -->
  <div class="overlay" id="joinOverlay">
    <div class="ov-title">🐍 SNAKE</div>
    <div class="ov-sub">Multiplayer · Everyone joins the same room</div>
    <input id="nameInput" maxlength="12" placeholder="Your name…" spellcheck="false">
    <button class="btn" id="joinBtn">▶ JOIN GAME</button>
    <div class="ov-sub" style="font-size:0.68rem;color:#475569">Arrow keys / WASD to move</div>
  </div>

  <!-- waiting overlay -->
  <div class="overlay hidden" id="waitOverlay">
    <div class="ov-title">WAITING…</div>
    <div class="ov-sub" id="waitSub">You're in the room.<br>Game starts when someone clicks Start.</div>
    <button class="btn" id="startBtn">▶ START GAME</button>
    <div class="ov-sub" id="waitPlayers">1 player in room</div>
  </div>

  <!-- dead overlay -->
  <div class="overlay hidden" id="deadOverlay">
    <div class="ov-title">💀 YOU DIED</div>
    <div class="ov-sub" id="deadMsg"></div>
  </div>
</div>

<div class="dpad">
  <button class="dpad-btn up"    data-dir="up">▲</button>
  <button class="dpad-btn left"  data-dir="left">◀</button>
  <button class="dpad-btn right" data-dir="right">▶</button>
  <button class="dpad-btn down"  data-dir="down">▼</button>
</div>
<div class="hint">Arrow keys / WASD · P = pause</div>

<script>
// ── Config ─────────────────────────────────────────────────
const ROOM   = 'capdist-snake-room-001';
const COLS   = 20, ROWS = 20, CS = 400, S = CS / COLS;
const TICK   = 130;
const RESPAWN_MS = 3000;
const COLORS = ['#a78bfa','#60a5fa','#f472b6','#34d399','#fbbf24','#f87171','#38bdf8','#c084fc'];
const STALE_MS = 8000; // remove player if no heartbeat for 8s

// ── Gun setup ──────────────────────────────────────────────
const gun = Gun([
  'https://gun-manhattan.herokuapp.com/gun',
  'https://gunjs.herokuapp.com/gun',
  'https://gun-us.herokuapp.com/gun'
]);
const room = gun.get(ROOM);

// ── Local state ────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

let myId    = 'p_' + Math.random().toString(36).slice(2, 9);
let myName  = '';
let myColor = '';
let myDir   = { x: 1, y: 0 };
let myNext  = { x: 1, y: 0 };
let mySnake = [];
let myScore = 0;
let myAlive = false;
let joined  = false;
let gameRunning = false;

let players = {};   // id → { name, color, snakeJSON, dir, score, alive, ts }
let food    = { x: 5, y: 5 };
let tickTimer   = null;
let respawnTimer = null;
let animId      = null;

// ── UI refs ────────────────────────────────────────────────
const joinOverlay  = document.getElementById('joinOverlay');
const waitOverlay  = document.getElementById('waitOverlay');
const deadOverlay  = document.getElementById('deadOverlay');
const statusPill   = document.getElementById('statusPill');
const waitPlayers  = document.getElementById('waitPlayers');
const nameInput    = document.getElementById('nameInput');
const respawnBar   = document.getElementById('respawnBar');
const respawnFill  = document.getElementById('respawnFill');
const deadMsg      = document.getElementById('deadMsg');

// ── Helpers ────────────────────────────────────────────────
function randomName() {
  const a = ['Swift','Neon','Ghost','Cyber','Blaze','Storm','Pixel','Void'];
  const b = ['Viper','Cobra','Mamba','Asp','Boa','Python','Adder','Krait'];
  return a[Math.random()*a.length|0] + b[Math.random()*b.length|0];
}

function pickColor() {
  const used = Object.values(players).map(p => p.color);
  return COLORS.find(c => !used.includes(c)) || COLORS[Math.random()*COLORS.length|0];
}

function spawnSnake() {
  const x = 3 + Math.floor(Math.random() * (COLS - 6));
  const y = 3 + Math.floor(Math.random() * (ROWS - 6));
  return [{ x, y }, { x: x-1, y }, { x: x-2, y }];
}

function newFood(snakes) {
  const occ = snakes.flat();
  let f;
  do { f = { x: Math.random()*COLS|0, y: Math.random()*ROWS|0 }; }
  while (occ.some(s => s.x===f.x && s.y===f.y));
  return f;
}

// ── Publish my state to Gun ────────────────────────────────
function publishMe() {
  if (!joined) return;
  room.get('players').get(myId).put({
    name:      myName,
    color:     myColor,
    snakeJSON: JSON.stringify(mySnake),
    dirX:      myDir.x,
    dirY:      myDir.y,
    score:     myScore,
    alive:     myAlive ? 1 : 0,
    ts:        Date.now()
  });
}

function publishFood(f) {
  room.get('food').put({ x: f.x, y: f.y, ts: Date.now() });
}

function publishGameState(running) {
  room.get('meta').put({ running: running ? 1 : 0, ts: Date.now() });
}

// ── Subscribe to Gun ───────────────────────────────────────
function subscribe() {
  // other players
  room.get('players').map().on((data, id) => {
    if (!data || id === myId) return;
    if (Date.now() - (data.ts || 0) > STALE_MS) { delete players[id]; return; }
    players[id] = {
      id,
      name:  data.name  || '?',
      color: data.color || '#fff',
      snake: safeParseSnake(data.snakeJSON),
      dir:   { x: data.dirX || 1, y: data.dirY || 0 },
      score: data.score || 0,
      alive: data.alive === 1,
      ts:    data.ts || 0
    };
    updateWaitUI();
  });

  // food
  room.get('food').on(data => {
    if (data && data.x != null) food = { x: data.x, y: data.y };
  });

  // game meta
  room.get('meta').on(data => {
    if (!data) return;
    if (data.running === 1 && !gameRunning) startGame();
  });
}

function safeParseSnake(json) {
  try { const s = JSON.parse(json); return Array.isArray(s) ? s : []; }
  catch { return []; }
}

// ── Heartbeat (keep presence alive) ───────────────────────
setInterval(() => {
  if (joined) publishMe();
  // prune stale players
  const now = Date.now();
  Object.keys(players).forEach(id => {
    if (now - (players[id].ts || 0) > STALE_MS) delete players[id];
  });
  updateWaitUI();
}, 2000);

// ── Game tick (each player runs their own snake) ───────────
function startGame() {
  if (gameRunning) return;
  gameRunning = true;
  waitOverlay.classList.add('hidden');
  deadOverlay.classList.add('hidden');
  statusPill.textContent = '● LIVE';
  statusPill.className = 'online';

  mySnake = spawnSnake();
  myDir   = { x: 1, y: 0 };
  myNext  = { x: 1, y: 0 };
  myAlive = true;
  myScore = 0;
  publishMe();

  // only first player seeds food
  if (Object.keys(players).length === 0) {
    food = newFood([mySnake]);
    publishFood(food);
  }

  tickTimer = setInterval(tick, TICK);
}

function tick() {
  if (!myAlive) return;
  myDir = myNext;

  const head = { x: mySnake[0].x + myDir.x, y: mySnake[0].y + myDir.y };

  // wall
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { die(); return; }

  // self
  if (mySnake.some(s => s.x === head.x && s.y === head.y)) { die(); return; }

  // other snakes
  const others = Object.values(players).filter(p => p.alive);
  if (others.some(p => p.snake.some(s => s.x === head.x && s.y === head.y))) { die(); return; }

  mySnake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    myScore++;
    // whoever eats seeds new food
    const allSnakes = [mySnake, ...others.map(p => p.snake)];
    food = newFood(allSnakes);
    publishFood(food);
  } else {
    mySnake.pop();
  }

  publishMe();
}

function die() {
  myAlive = false;
  mySnake = [];
  publishMe();

  deadMsg.textContent = `Score: ${myScore}`;
  deadOverlay.classList.remove('hidden');
  respawnBar.classList.add('show');

  let elapsed = 0;
  clearInterval(respawnTimer);
  respawnTimer = setInterval(() => {
    elapsed += 100;
    respawnFill.style.width = Math.max(0, 100 - (elapsed / RESPAWN_MS * 100)) + '%';
    if (elapsed >= RESPAWN_MS) {
      clearInterval(respawnTimer);
      respawnBar.classList.remove('show');
      deadOverlay.classList.add('hidden');
      respawn();
    }
  }, 100);
}

function respawn() {
  mySnake = spawnSnake();
  myDir   = { x: 1, y: 0 };
  myNext  = { x: 1, y: 0 };
  myAlive = true;
  publishMe();
}

// ── Draw ───────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, CS, CS);

  // grid dots
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  for (let x = 0; x < COLS; x++)
    for (let y = 0; y < ROWS; y++)
      ctx.fillRect(x*S+S/2-1, y*S+S/2-1, 2, 2);

  // food
  const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 200);
  ctx.fillStyle = '#f472b6';
  ctx.shadowColor = '#f472b6';
  ctx.shadowBlur = 8 + pulse * 10;
  ctx.beginPath();
  ctx.arc(food.x*S+S/2, food.y*S+S/2, S/2-3+pulse, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // draw all snakes
  const allPlayers = [
    { snake: mySnake, color: myColor, name: myName, dir: myDir, alive: myAlive, score: myScore },
    ...Object.values(players)
  ];

  allPlayers.forEach(p => {
    if (!p.alive || !p.snake || p.snake.length === 0) return;
    p.snake.forEach((seg, i) => {
      const t = i / p.snake.length;
      ctx.globalAlpha = 1 - t * 0.45;
      ctx.fillStyle = p.color;
      ctx.shadowColor = i === 0 ? p.color : 'transparent';
      ctx.shadowBlur  = i === 0 ? 14 : 0;
      ctx.beginPath();
      ctx.roundRect(seg.x*S+1.5, seg.y*S+1.5, S-3, S-3, 5);
      ctx.fill();
    });
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;

    // name tag
    const head = p.snake[0];
    ctx.fillStyle = p.color;
    ctx.font = `bold ${S*0.52}px Segoe UI`;
    ctx.textAlign = 'center';
    ctx.fillText(p.name.slice(0, 10), head.x*S+S/2, head.y*S - 3);

    // eyes
    const d = p.dir || { x:1, y:0 };
    const perp = { x: -d.y, y: d.x };
    const cx = head.x*S+S/2, cy = head.y*S+S/2;
    ctx.fillStyle = '#0a0a0f';
    [1, -1].forEach(side => {
      ctx.beginPath();
      ctx.arc(cx+d.x*S*0.22+perp.x*S*0.18*side, cy+d.y*S*0.22+perp.y*S*0.18*side, 2, 0, Math.PI*2);
      ctx.fill();
    });
  });

  ctx.textAlign = 'left';

  // scoreboard
  const sb = document.getElementById('scoreboard');
  sb.innerHTML = '';
  allPlayers
    .filter(p => p.name)
    .sort((a, b) => b.score - a.score)
    .forEach(p => {
      const el = document.createElement('div');
      el.className = 'sb-entry' + (p.alive ? '' : ' sb-dead');
      el.innerHTML = `<div class="sb-dot" style="background:${p.color}"></div>${p.name}: ${p.score}`;
      sb.appendChild(el);
    });

  animId = requestAnimationFrame(draw);
}

// ── Controls ───────────────────────────────────────────────
const DIRS = {
  ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
  KeyW:{x:0,y:-1}, KeyS:{x:0,y:1}, KeyA:{x:-1,y:0}, KeyD:{x:1,y:0}
};
document.addEventListener('keydown', e => {
  if (DIRS[e.code]) {
    const d = DIRS[e.code];
    if (!(d.x === -myDir.x && d.y === -myDir.y)) myNext = d;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  }
});

document.querySelectorAll('.dpad-btn').forEach(btn => {
  const map = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
  const press = () => {
    const d = map[btn.dataset.dir];
    if (d && !(d.x === -myDir.x && d.y === -myDir.y)) myNext = d;
  };
  btn.addEventListener('click', press);
  btn.addEventListener('touchstart', e => { e.preventDefault(); press(); }, { passive: false });
});

// ── Join flow ──────────────────────────────────────────────
nameInput.value = randomName();

function updateWaitUI() {
  if (gameRunning) return;
  const n = Object.keys(players).length + (joined ? 1 : 0);
  waitPlayers.textContent = `${n} player${n !== 1 ? 's' : ''} in room`;
}

document.getElementById('joinBtn').addEventListener('click', () => {
  myName  = nameInput.value.trim() || randomName();
  myColor = pickColor();
  joined  = true;

  joinOverlay.classList.add('hidden');
  waitOverlay.classList.remove('hidden');
  statusPill.textContent = '● WAITING';
  statusPill.className = 'waiting';

  subscribe();
  publishMe();
  updateWaitUI();
});

document.getElementById('startBtn').addEventListener('click', () => {
  publishGameState(true);
  startGame();
});

// ── Boot ───────────────────────────────────────────────────
statusPill.textContent = 'ready';
draw();

window.addEventListener('beforeunload', () => {
  if (joined) room.get('players').get(myId).put({ ts: 0 });
});
</script>
</body>
</html>
